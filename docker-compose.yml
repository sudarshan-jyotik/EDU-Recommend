version: "3.9"
services:
  api:
    build: .
    container_name: edu-recommend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./frontend:/app/frontend
    environment:
      - MODEL_DIR=models
      - DEBUG=false
      - FEEDBACK_LOG_PATH=feedback_log.jsonl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
