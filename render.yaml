# render.yaml
# Render.com deployment configuration
services:
  - type: web
    name: edu-recommend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_DIR
        value: models
      - key: FEEDBACK_LOG_PATH
        value: feedback_log.jsonl
      - key: DEBUG
        value: "false"
