name: CI

on:
  push:
    branches: [ main, develop, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NLTK data
        run: python scripts/download_nltk.py

      - name: Verify imports
        run: |
          python -c "from app.main import app; print('app: OK')"
          python -c "from app.recommenders.study_plan import StudyPlanGenerator; g=StudyPlanGenerator(); print('plan: OK')"

      - name: Run tests (skip ML — no pickles in CI)
        env:
          SKIP_MODEL_TESTS: "1"
        run: pytest tests/ -v --tb=short
